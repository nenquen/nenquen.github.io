<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Nen's Stuff</title>
    <meta name="description" content="This page does not exist.">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#2e2843">
    <link rel="icon" href="/assets/images/favicon.png" type="image/png">
    <link rel="stylesheet" href="https://unpkg.com/7.css@0.21.1/dist/7.css" integrity="sha384-WN2QoZVHe/0w3aOmuNlv18gZn4NKrLXxgsUtsLAXPV1zCE/49AFfl07gQ2knrObx" crossorigin="anonymous">
    <link rel="stylesheet" href="/assets/css/style.css">
    <style>
        /* 404 overrides: keep the site's Gentoo theme, override the body layout */
        body {
            align-items: center;
        }
        .error-window {
            max-width: 420px;
            text-align: center;
        }
        .error-code {
            margin: 0 0 10px;
            font-size: 42px;
            font-weight: 700;
            color: #3e355a;
        }
        .error-window p {
            margin: 0 0 18px;
            color: #222;
        }
        .error-actions {
            display: flex;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="window glass active main-window error-window" style="--w7-w-bg: #54487A;">
            <div class="title-bar">
                <div class="title-bar-text">Windows Explorer</div>
                <div class="title-bar-controls">
                    <button type="button" aria-label="Minimize" aria-disabled="true" tabindex="-1"></button>
                    <button type="button" aria-label="Maximize" aria-disabled="true" tabindex="-1"></button>
                    <button type="button" aria-label="Close" aria-disabled="true" tabindex="-1"></button>
                </div>
            </div>
            <div class="window-body has-space">
                <h1 class="error-code">404</h1>
                <p>The location you typed could not be found on this site.</p>
                <div class="error-actions">
                    <a href="/" role="button" class="default">Go to homepage</a>
                    <button type="button" onclick="history.back()">Go back</button>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
